<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HavenScout - AI Real Estate & Property Assistant</title>
<!-- Google Fonts & Material Symbols for A2UI components -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<style>
  :root {
    --accent: #059669;
    --accent-dark: #047857;
    --accent-light: #ecfdf5;
    --accent-gradient: linear-gradient(135deg, #047857 0%, #10b981 100%);
    --bg: #f8fafc;
    --card-bg: #ffffff;
    --text-primary: #0f172a;
    --text-secondary: #475569;
    --border: #e2e8f0;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
    --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.08);
    --radius-lg: 16px;
    --radius-md: 12px;
  }

  * { box-sizing: border-box; }
  
  body {
    margin: 0;
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* Header Branding */
  header {
    background: var(--accent-gradient);
    color: #ffffff;
    padding: 1rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: var(--shadow-md);
    z-index: 10;
  }

  .header-brand {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .brand-icon {
    font-size: 1.75rem;
    background: rgba(255,255,255,0.2);
    padding: 0.4rem;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .header-title h1 {
    margin: 0;
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .header-title p {
    margin: 0;
    font-size: 0.75rem;
    opacity: 0.9;
    font-weight: 500;
  }

  .status-badge {
    background: rgba(255,255,255,0.25);
    font-size: 0.75rem;
    padding: 0.25rem 0.65rem;
    border-radius: 20px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  .status-dot {
    width: 7px;
    height: 7px;
    background-color: #34d399;
    border-radius: 50%;
  }

  /* Main Dialogue Container */
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem 1rem;
    max-width: 840px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }

  .msg-row {
    display: flex;
    gap: 0.75rem;
    max-width: 88%;
  }

  .msg-row.user {
    align-self: flex-end;
    flex-direction: row-reverse;
  }

  .msg-row.agent {
    align-self: flex-start;
  }

  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    flex-shrink: 0;
    box-shadow: var(--shadow-sm);
  }

  .msg-row.agent .avatar {
    background: var(--accent-light);
    color: var(--accent);
    border: 1px solid rgba(5, 150, 105, 0.2);
  }

  .msg-row.user .avatar {
    background: #e2e8f0;
    color: var(--text-secondary);
  }

  .bubble {
    padding: 0.85rem 1.15rem;
    border-radius: var(--radius-lg);
    background: var(--card-bg);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    line-height: 1.5;
    font-size: 0.95rem;
    color: var(--text-primary);
    white-space: pre-wrap;
    word-break: break-word;
  }

  .msg-row.user .bubble {
    background: var(--accent-gradient);
    color: #ffffff;
    border: none;
    border-bottom-right-radius: 4px;
  }

  .msg-row.agent .bubble {
    border-bottom-left-radius: 4px;
  }

  /* Rich A2UI Cards inside Bubble */
  .bubble.rich {
    background: transparent;
    border: none;
    padding: 0;
    box-shadow: none;
    width: 100%;
    white-space: normal;
  }

  /* Bottom Controls & Prompts Section */
  .controls-container {
    max-width: 840px;
    width: 100%;
    margin: 0 auto;
    padding: 0 1rem 1rem 1rem;
  }

  /* Clickable Prompt Pills */
  .prompts-wrapper {
    display: flex;
    gap: 0.5rem;
    overflow-x: auto;
    padding-bottom: 0.6rem;
    scrollbar-width: thin;
  }

  .prompt-pill {
    background: #ffffff;
    border: 1px solid var(--border);
    color: var(--accent-dark);
    padding: 0.45rem 0.85rem;
    border-radius: 20px;
    font-size: 0.825rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s ease;
    box-shadow: var(--shadow-sm);
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  .prompt-pill:hover {
    background: var(--accent-light);
    border-color: var(--accent);
    transform: translateY(-1px);
    box-shadow: var(--shadow-md);
  }

  /* Input Form */
  form {
    display: flex;
    gap: 0.75rem;
    padding: 0.75rem 1rem;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-md);
  }

  input {
    flex: 1;
    border: none;
    outline: none;
    font-family: inherit;
    font-size: 0.95rem;
    color: var(--text-primary);
    background: transparent;
  }

  input::placeholder {
    color: var(--text-secondary);
    opacity: 0.7;
  }

  button {
    padding: 0.65rem 1.25rem;
    border: none;
    border-radius: var(--radius-md);
    background: var(--accent-gradient);
    color: #ffffff;
    font-weight: 600;
    font-family: inherit;
    font-size: 0.9rem;
    cursor: pointer;
    transition: opacity 0.2s ease;
    display: flex;
    align-items: center;
    gap: 0.35rem;
  }

  button:hover {
    opacity: 0.92;
  }

  /* --- A2UI component styles (Card, Column, Row, Text, Divider, List, Image, Icon) --- */
  .a2card {
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1.1rem;
    background: var(--card-bg);
    box-shadow: var(--shadow-md);
    max-width: 100%;
  }

  .a2card + .a2card, .a2col > .a2card { margin-top: 0.75rem; }
  .a2col { display: flex; flex-direction: column; gap: 0.5rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  .a2text { margin: 0; line-height: 1.45; }
  .a2text.a2-h1 { font-size: 1.4rem; font-weight: 700; color: var(--accent-dark); }
  .a2text.a2-h2 { font-size: 1.2rem; font-weight: 700; color: var(--text-primary); }
  .a2text.a2-h3 { font-size: 1.05rem; font-weight: 600; color: var(--accent-dark); }
  .a2text.a2-h4 { font-size: 0.95rem; font-weight: 600; }
  .a2text.a2-caption { font-size: 0.85rem; color: var(--text-secondary); }
  .a2divider { border: none; border-top: 1px solid var(--border); margin: 0.5rem 0; width: 100%; }
  .a2img { max-width: 100%; border-radius: var(--radius-md); display: block; object-fit: cover; }
  .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-size: 1.25rem; line-height: 1; vertical-align: middle; color: var(--accent); }
  
  /* Loading dots animation */
  .typing-indicator {
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .typing-indicator span {
    width: 6px;
    height: 6px;
    background-color: var(--accent);
    border-radius: 50%;
    animation: bounce 1.4s infinite ease-in-out both;
  }

  .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
  .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0); }
    40% { transform: scale(1.0); }
  }
</style>
</head>
<body>

<header>
  <div class="header-brand">
    <div class="brand-icon">🏡</div>
    <div class="header-title">
      <h1>HavenScout</h1>
      <p>AI Real Estate & Property Assistant</p>
    </div>
  </div>
  <div class="status-badge">
    <span class="status-dot"></span>
    Agent Platform Live
  </div>
</header>

<div id="log">
  <div class="msg-row agent">
    <div class="avatar">🏡</div>
    <div class="bubble">Welcome to <strong>HavenScout</strong>! I can help you search Austin apartment listings, discover nearby venues & coffee shops, and perform deposit & financial calculations. What are you looking for today?</div>
  </div>
</div>

<div class="controls-container">
  <!-- 3 Tailored Clickable Example Prompts -->
  <div class="prompts-wrapper">
    <button type="button" class="prompt-pill" onclick="sendPrompt('Find 2 bedroom apartments in Central Austin under $2,500/mo')">
      <span>🏢</span> 2-bed in Central Austin &lt; $2,500
    </button>
    <button type="button" class="prompt-pill" onclick="sendPrompt('Find nearby coffee shops around 1200 Congress Ave')">
      <span>☕</span> Coffee shops near 1200 Congress
    </button>
    <button type="button" class="prompt-pill" onclick="sendPrompt('Calculate compound interest on a $3,000 security deposit at 4.5% over 3 years')">
      <span>💰</span> Compound interest on $3k deposit
    </button>
  </div>

  <form id="form">
    <input id="input" placeholder="Ask HavenScout about apartments, venues, or interest..." autocomplete="off" autofocus>
    <button type="submit">
      Send
    </button>
  </form>
</div>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function createMessage(who) {
  const row = el("div", "msg-row " + who);
  const avatar = el("div", "avatar", who === "agent" ? "🏡" : "👤");
  const b = el("div", "bubble");
  row.appendChild(avatar);
  row.appendChild(b);
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
  return b;
}

function sendPrompt(promptText) {
  input.value = promptText;
  form.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * -------------------------------------------------------------------------- */
function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  
  createMessage("user").textContent = text;
  input.value = "";
  
  const b = createMessage("agent");
  const indicator = el("div", "typing-indicator");
  indicator.appendChild(el("span"));
  indicator.appendChild(el("span"));
  indicator.appendChild(el("span"));
  b.appendChild(indicator);

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text })
    });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
});
</script>
</body>
</html>
